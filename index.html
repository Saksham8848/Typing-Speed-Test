<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <h1>Typing Speed Test</h1>
        <p class="subtitle">Start typing to begin. The timer starts with your first key.</p>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">WPM</span>
                <span class="stat-value" id="wpm">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">CPM</span>
                <span class="stat-value" id="cpm">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Accuracy</span>
                <span class="stat-value" id="accuracy">100%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span class="stat-value" id="time">0s</span>
            </div>
        </div>

        <div class="text-area" id="text-display"></div>

        <textarea id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false"></textarea>

        <button id="restart-button">Restart</button>

        <div class="results hidden" id="results">
            <h2>Test Complete!</h2>
            <p>WPM: <strong id="final-wpm">0</strong></p>
            <p>CPM: <strong id="final-cpm">0</strong></p>
            <p>Accuracy: <strong id="final-accuracy">0%</strong></p>
            <p>Time: <strong id="final-time">0s</strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
